<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Autofill Rules — Drawflow</title>
  <link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="vendor/drawflow/drawflow.min.css">
  <link rel="stylesheet" href="options.css" />
  <style>
    html, body { height: 100%; margin: 0; }
    #app { height: 100vh; display: flex; }
    #sidebar { width: 280px; border-right: 1px solid #ddd; padding: 12px; box-sizing: border-box; overflow: auto; }
    #main { flex: 1; display: flex; flex-direction: column; padding: 12px; box-sizing: border-box; }
    #ruleList { max-height: 80vh; overflow: auto; }
    #drawflow { flex: 1; border: 1px solid #ccc; background: #fafafa; min-height: 320px; position: relative; }
    .step-type { 
      cursor: grab; 
      user-select: none; 
      display: inline-block; 
      min-width: 80px; 
      text-align: center; 
      padding: 4px 8px; 
      font-size: 12px; 
    }
    .step-type.disabled { 
      cursor: not-allowed; 
      opacity: 0.5; 
    }
    .node-desc { display: block; font-size: 12px; color: #666; margin-top: 6px; word-break: break-word; }
    #notification { z-index: 2000; }
    .rules-in-group.collapsed { display: none; }
    .start-node { 
      background: #e6f3ff; 
      padding: 4px; 
      border-radius: 4px; 
    }
    #stepPalette { margin-top: 8px; }
    .node-toggle { 
      display: flex; 
      align-items: center; 
      gap: 4px; 
      cursor: default; 
    }
    .node-enabled { 
      margin: 0; 
      cursor: pointer; 
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="sidebar">
      <h4>Правила</h4>
      <div id="ruleList" class="mb-2"></div>
      <div class="d-flex gap-2 mb-3">
        <button id="addRuleBtn" class="btn btn-sm btn-primary">➕ Группа</button>
        <button id="exportRulesBtn" class="btn btn-sm btn-secondary">⬇ Экспорт</button>
      </div>
      <label class="btn btn-sm btn-success w-100 mb-3">
        ⬆ Импорт
        <input type="file" id="importRulesInput" accept="application/json" hidden>
      </label>
    </div>

    <div id="main">
      <div id="ruleDetailsContainer" class="mb-2"></div>
      <div id="drawflow"></div>
      <div class="actions text-end mt-2">
        <button id="saveRulesBtn" class="btn btn-primary">💾 Сохранить все правила</button>
      </div>
    </div>
  </div>

  <!-- Notification -->
  <div id="notification" class="position-fixed bottom-0 end-0 m-3"></div>

  <!-- Modal -->
  <div class="modal fade" id="stepEditorModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Редактирование шага</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-2">
            <label class="form-label">Тип (не редактируется)</label>
            <input type="text" id="stepType" class="form-control" readonly>
          </div>
          <div class="mb-2">
            <label class="form-label">Селекторы</label>
            <div id="selectorsContainer"></div>
          </div>
          <div class="mb-2">
            <label class="form-label">Значение</label>
            <input type="text" id="stepValue" class="form-control">
          </div>
          <div class="mb-2">
            <label class="form-label">Описание (короткое)</label>
            <input type="text" id="stepDescription" class="form-control">
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="stepEnabled">
            <label class="form-check-label" for="stepEnabled">Включено</label>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-warning" id="duplicateStepBtn">📋 Дублировать</button>
          <button class="btn btn-danger" id="deleteStepBtn">✖ Удалить</button>
          <button class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
          <button class="btn btn-primary" id="saveStepBtn">Сохранить</button>
        </div>
      </div>
    </div>
  </div>

  <script src="vendor/drawflow/drawflow.min.js"></script>
  <script src="vendor/bootstrap/js/bootstrap.bundle.js"></script>
  <script src="options.js"></script>
</body>
</html>
